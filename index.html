<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stick Fight Prototype</title>
  <style>
    html, body { margin: 0; padding: 0; background: #08080c; height: 100%; overflow: hidden; }
    #game { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
    canvas { image-rendering: pixelated; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Collect any script errors so automated tests can read them.
    window.__ERR = [];
    window.onerror = function (msg, src, line) {
      window.__ERR.push(msg + ' @ ' + src + ':' + line);
    };
  </script>
  <script src="phaser.min.js"></script>
  <script src="js/fighter.js?v=f1e3dab"></script>
  <script src="js/main.js?v=f1e3dab"></script>
</body>
</html>
